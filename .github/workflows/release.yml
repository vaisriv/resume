name: Build & Release
on:
        push:
                branches:
                        - main
        workflow_dispatch:
permissions:
        contents: write
jobs:
        build-and-release:
                runs-on: ubuntu-latest
                outputs:
                        published: ${{ steps.release.outputs.new_release_published }}
                steps:
                        -
                                name: Checkout
                                uses: actions/checkout@v5
                                with:
                                        fetch-depth: 0
                        -
                                name: Install Nix
                                uses: cachix/install-nix-action@v31
                                with:
                                        github_access_token: ${{ secrets.GITHUB_TOKEN }}
                        -
                                name: Compile with Nix
                                run: |
                                        nix run .#resume
                        -
                                name: Semantic Release
                                id: release
                                uses: cycjimmy/semantic-release-action@v5
                                env:
                                        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                        -
                                name: Prepare Pages site
                                if: steps.release.outputs.new_release_published == 'true' || github.event_name == 'workflow_dispatch'
                                run: |
                                        mkdir -p _site
                                        cp resume.pdf _site/resume.pdf
                                        echo '<meta http-equiv="refresh" content="0; url=resume.pdf">' > _site/index.html
                        -
                                name: Upload Pages artifact
                                if: steps.release.outputs.new_release_published == 'true' || github.event_name == 'workflow_dispatch'
                                uses: actions/upload-pages-artifact@v5
                                with:
                                        path: _site
        deploy-pages:
                needs: build-and-release
                if: needs.build-and-release.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
                runs-on: ubuntu-latest
                permissions:
                        pages: write
                        id-token: write
                environment:
                        name: github-pages
                        url: ${{ steps.deployment.outputs.page_url }}
                steps:
                        -
                                name: Deploy to GitHub Pages
                                id: deployment
                                uses: actions/deploy-pages@v5
